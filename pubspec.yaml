name: familyvault
description: Private family finance and encrypted document management.
publish_to: none
version: 0.1.0+4

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  fl_chart: ^1.3.1
  drift: ^2.35.4
  sqlite3: ^3.9.1
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  crypto: ^3.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  cryptography: ^2.9.0
  local_auth: ^3.0.2
  file_picker: 13.3.3
  image_picker: 1.2.4
  pdfrx: 2.12.1
  google_sign_in: 7.2.0
  cupertino_icons: 2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
